name: Build desktop packages

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    name: Package ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            rid: linux-x64
            archive: tar.gz
          - runner: ubuntu-latest
            rid: linux-arm64
            archive: tar.gz
          - runner: windows-latest
            rid: win-x64
            archive: zip
          - runner: windows-latest
            rid: win-arm64
            archive: zip
          - runner: macos-latest
            rid: osx-x64
            archive: tar.gz
          - runner: macos-latest
            rid: osx-arm64
            archive: tar.gz

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained application
        run: >-
          dotnet publish SlackYouTrack.CrossPlatform.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --output publish/${{ matrix.rid }}
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Create Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath SLAK-U-Track-${{ matrix.rid }}.zip

      - name: Create Unix archive
        if: runner.os != 'Windows'
        run: tar -czf SLAK-U-Track-${{ matrix.rid }}.tar.gz -C publish/${{ matrix.rid }} .

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: SLAK-U-Track-${{ matrix.rid }}
          path: SLAK-U-Track-${{ matrix.rid }}.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: packages

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" packages/*/* --generate-notes
